{

  "license" {
    "accept": "false"
    "accept": ${?ACCEPT_LIMITED_USE_LICENSE}
  }

  "output": {
    "good": {
      "type": "Delta"
      "type": ${?packaging.output.good.type}

      "deltaTableProperties": {
        "delta.logRetentionDuration": "interval 1 days"
        "delta.deletedFileRetentionDuration": "interval 1 days" # Delta 4.3 requires this to be <= logRetentionDuration; shortens the VACUUM safety window from Delta's 7-day default to 1 day
        "delta.dataSkippingStatsColumns": "load_tstamp,collector_tstamp,derived_tstamp,dvce_created_tstamp,true_tstamp"
        "delta.checkpointInterval": "50"
      }

      "icebergTableProperties": {
        "write.spark.accept-any-schema": "true"
        "write.object-storage.enabled": "true"
        "write.metadata.delete-after-commit.enabled": "true"
        "write.metadata.compression-codec": "gzip"
        "write.metadata.metrics.max-inferred-column-defaults": "0"
        "write.metadata.metrics.column.load_tstamp": "full"
        "write.metadata.metrics.column.collector_tstamp": "full"
        "write.metadata.metrics.column.derived_tstamp": "full"
        "write.metadata.metrics.column.dvce_created_tstamp": "full"
        "write.metadata.metrics.column.true_tstamp": "full"
        "commit.retry.num-retries": "20"
      }

      "icebergWriteOptions": {
        "merge-schema": "true"
        "check-ordering": "false" # The write schema's column order; nothing to do with row ordering
        "distribution-mode": "none"
        "fanout-enabled": "false" # Selects Iceberg's clustered writer, which holds one open file at a time. See `Writer.write`
      }

      "catalog": {
        "type": "Hadoop"
        "options": {}
      }
    }
  }

  "inMemBatchBytes": 50000000
  "cpuParallelismFraction": 0.75
  "windowing": "5 minutes"
  "numEagerWindows": 1
  "spark": {
    "taskRetries": 3
    "writerPartitioning": {
      "splitsPerFairShare": 4
      "minEventsPerSplit": 5000
    }
    "conf": {
      "spark.ui.enabled": "false"
      "spark.local.dir": "/tmp" # This is the default but it's important for us
      "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
      "spark.memory.fraction": "0.3" # Decreased from the Spark default to prevent OOMs
      "spark.sql.parquet.outputTimestampType": "TIMESTAMP_MICROS"
      "spark.sql.parquet.datetimeRebaseModeInWrite": "CORRECTED"
      # Storage owns none of the memory pool, so staged blocks borrow from execution and are the
      # first to be evicted. See SparkUtils.stageBatchesOffHeap for why that is the trade we want.
      "spark.memory.storageFraction": "0"
      "spark.rdd.compress": "true"
      "spark.databricks.delta.autoCompact.enabled": "false"
      "spark.scheduler.mode": "FAIR"
      # False gives better performance on the type of shuffle done by Lake Loader. It also gates the
      # early release of a window's staged batches: SnowplowInternalSparkBridge.materializeShuffle
      # cannot find the exchange in an adaptive plan, so with AQE on the loader silently falls back
      # to holding staged batches for the whole commit, with no error. Think twice before
      # overriding this.
      "spark.sql.adaptive.enabled": "false"
      # Spark 4 enables ANSI mode by default, which turns invalid casts and arithmetic overflow
      # into runtime errors instead of nulls. We have not audited its effect on this loader's
      # write path (e.g. the CAST behind the generated load_tstamp_date column and schema-evolution
      # casts), so keep the pre-4.0 semantics rather than adopt ANSI implicitly during the upgrade.
      "spark.sql.ansi.enabled": "false"
    }
  }

  "retries": {
    "setupErrors": {
      "delay": "30 seconds"
    }
    "transientErrors": {
      "delay": "1 second"
      "attempts": 5
    }
  }

  "http": {
    "client": ${snowplow.defaults.http.client}
  }

  "skipSchemas": []
  "respectIgluNullability": true
  "exitOnMissingIgluSchema": true

  "decompression": {
    "maxBytesInBatch": 5242880
    "maxBytesSinglePayload": 10000000
  }

  "monitoring": {
    "metrics": {
      "statsd": ${snowplow.defaults.statsd}
      "statsd": {
        "prefix": "snowplow.lakeloader"
      }
      "prometheus": ${snowplow.defaults.prometheus}
    }
    "webhook": ${snowplow.defaults.webhook}
    "sentry": {
      "tags": {
      }
    }
    "healthProbe": {
      "port": 8000
      "unhealthyLatency": "1 minute"
    }
  }

  "telemetry": ${snowplow.defaults.telemetry}
}
